<!doctype html>
<html lang="en" data-version="{{.Version}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<title>{{block "title" .}}annals{{end}}</title>
<link rel="stylesheet" href="/static/app.css?v={{.Version}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5f3ee'/%3E%3Cpath d='M11 6v20' stroke='%23b3261e' stroke-width='3.5'/%3E%3Cpath d='M21 6v20' stroke='%231a1916' stroke-width='2'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Annals">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body data-page="{{.Nav}}">
<header class="top">
  <a class="brand" href="/" aria-label="annals, today"><span class="mark" aria-hidden="true"></span>annals</a>
  <nav class="nav" aria-label="Board">
    <a href="/" class="{{if eq .Nav "today"}}on{{end}}"{{if eq .Nav "today"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Today</a>
    <a href="/records" class="{{if or (eq .Nav "records") (eq .Nav "event")}}on{{end}}"{{if eq .Nav "records"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Records</a>
    <a href="/approvals" class="{{if eq .Nav "approvals"}}on{{end}}"{{if eq .Nav "approvals"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 12l2 2 4-4"/><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg>Approvals</a>
    {{if .Admin}}<a href="/tokens" class="{{if or (eq .Nav "tokens") (eq .Nav "token")}}on{{end}}"{{if eq .Nav "tokens"}} aria-current="page"{{end}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg>Tokens</a>{{end}}
  </nav>
  <div class="me">
    <span class="who">{{.Email}}</span>
    <span class="lvl {{if .SeesPeople}}shown{{end}}" title="{{if .SeesPeople}}You see people: names, emails, and ids. Each page you open is on record.{{else}}People show as refs such as p-3f9a1c2b7e4d. A PII reader sees who they are.{{end}}">{{if .SeesPeople}}people shown{{else}}people hidden{{end}}</span>
  </div>
</header>
<main>
{{block "content" .}}{{end}}
</main>
<footer class="foot">annals {{.Version}}. Who did what, to what, with whom. Never content.</footer>
<script src="/static/faro-web-sdk.iife.js" defer></script>
<script src="/static/faro-web-tracing.iife.js" defer></script>
<script src="/static/app.js" defer></script>
</body>
</html>
